name: CD

on:
  workflow_call:
    inputs:
      action:
        description: 'Deployment action'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      action:
        description: 'Deployment action'
        required: true
        type: choice
        options:
          - deploy
          - redeploy

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  STACK_NAME: theswarm

jobs:
  build:
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build]
    if: inputs.action == 'deploy'
    runs-on: [self-hosted, jre-server]
    environment: int
    # 30 min of waiting for a running cycle, then the deploy itself.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/write-env
        with:
          mattermost_bot_token: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          github_token: ${{ secrets.BOT_GITHUB_TOKEN }}
          swarm_po_mattermost_token: ${{ secrets.SWARM_PO_MATTERMOST_TOKEN }}
          swarm_po_github_repo: ${{ secrets.SWARM_PO_GITHUB_REPO }}
          swarm_po_github_repos: ${{ secrets.SWARM_PO_GITHUB_REPOS }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          external_url: ${{ secrets.EXTERNAL_URL }}
          seq_url: ${{ secrets.SEQ_URL }}
          seq_api_key: ${{ secrets.SEQ_API_KEY }}
          swarm_vault_master_key: ${{ secrets.SWARM_VAULT_MASTER_KEY }}
          swarm_access_key: ${{ secrets.SWARM_ACCESS_KEY }}
          swarm_session_secret: ${{ secrets.SWARM_SESSION_SECRET }}
          swarm_webhook_secret: ${{ secrets.SWARM_WEBHOOK_SECRET }}
      - name: Wait for running cycles
        # A deploy restarts the service and interrupts a running cycle. The
        # boot resumer brings it back once (V2 M4), but the node in flight
        # is lost, and a second deploy in the same cycle loses the cycle:
        # a merge made while prod was idle landed ten minutes later in the
        # middle of 2f5114ae7713 (2026-09-25). Wait for idle, bounded; an API
        # that does not answer never blocks a deploy. Only a cycle's own
        # status counts: a grep for "running" anywhere also matched phases
        # left running inside reaped cycles, and every deploy waited 30 min.
        env:
          SWARM_ACCESS_KEY: ${{ secrets.SWARM_ACCESS_KEY }}
          SWARM_BASE: https://bots.jrec.fr/swarm
          MAX_WAIT_SECONDS: 1800
        run: |
          active_cycles() {
            python3 -c '
          import json, sys
          try:
              data = json.load(sys.stdin)
          except ValueError:
              data = []
          rows = data.get("cycles", []) if isinstance(data, dict) else data
          print(sum(1 for c in rows if isinstance(c, dict) and c.get("status") in ("running", "queued")))
          ' 2>/dev/null || echo 0
          }
          deadline=$(( $(date +%s) + MAX_WAIT_SECONDS ))
          while :; do
            body=$(curl -s --max-time 20 -H "Authorization: Bearer $SWARM_ACCESS_KEY" "$SWARM_BASE/api/cycles" || true)
            if [ "$(printf '%s' "$body" | active_cycles)" = 0 ]; then
              echo "No cycle running — deploying."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::A cycle is still running after $((MAX_WAIT_SECONDS / 60)) min — deploying anyway; it will resume."
              break
            fi
            echo "A cycle is running — waiting before the deploy."
            sleep 30
          done
      - name: Deploy
        run: |
          export TS_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          export TS_TAG=${{ github.sha }}
          echo "Deploying $TS_IMAGE:$TS_TAG"

          for i in $(seq 1 5); do
            echo "Pulling image (attempt $i/5)..."
            if docker pull $TS_IMAGE:$TS_TAG; then break; fi
            echo "Pull failed, retrying in 15s..."
            sleep 15
          done

          docker stack up -c docker-compose.yml ${{ env.STACK_NAME }}
      - name: Verify deployment health
        run: |
          echo "Waiting for service to stabilise..."
          sleep 15
          OK=0
          for i in $(seq 1 30); do
            REPLICAS=$(docker service ls --filter name=theswarm_theswarm --format '{{.Replicas}}' | head -1)
            CID=$(docker ps -q --filter "label=com.docker.swarm.service.name=theswarm_theswarm" | head -1)
            HEALTH="unknown"
            if [ -n "$CID" ]; then
              HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$CID" 2>/dev/null || echo "inspect-failed")
            fi
            echo "Attempt $i/30 - replicas: $REPLICAS  health: $HEALTH"
            if [ "$REPLICAS" = "1/1" ] && [ "$HEALTH" = "healthy" ]; then
              echo "TheSwarm is healthy"
              OK=1
              break
            fi
            sleep 10
          done
          if [ "$OK" != "1" ]; then
            echo "ERROR: TheSwarm failed to become healthy — rolling back"
            docker service ps theswarm_theswarm --no-trunc 2>&1 | head -20
            docker service logs theswarm_theswarm --tail 100 --no-trunc 2>&1 || true
            docker service rollback theswarm_theswarm || echo "rollback command failed"
            exit 1
          fi

  redeploy:
    if: inputs.action == 'redeploy'
    runs-on: [self-hosted, jre-server]
    environment: int
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/write-env
        with:
          mattermost_bot_token: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          github_token: ${{ secrets.BOT_GITHUB_TOKEN }}
          swarm_po_mattermost_token: ${{ secrets.SWARM_PO_MATTERMOST_TOKEN }}
          swarm_po_github_repo: ${{ secrets.SWARM_PO_GITHUB_REPO }}
          swarm_po_github_repos: ${{ secrets.SWARM_PO_GITHUB_REPOS }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          external_url: ${{ secrets.EXTERNAL_URL }}
          seq_url: ${{ secrets.SEQ_URL }}
          seq_api_key: ${{ secrets.SEQ_API_KEY }}
          swarm_vault_master_key: ${{ secrets.SWARM_VAULT_MASTER_KEY }}
          swarm_access_key: ${{ secrets.SWARM_ACCESS_KEY }}
          swarm_session_secret: ${{ secrets.SWARM_SESSION_SECRET }}
          swarm_webhook_secret: ${{ secrets.SWARM_WEBHOOK_SECRET }}
      - name: Redeploy (latest)
        run: |
          export TS_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          export TS_TAG=latest
          docker pull $TS_IMAGE:$TS_TAG
          docker stack up -c docker-compose.yml ${{ env.STACK_NAME }}
