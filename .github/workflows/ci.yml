name: CI

on:
  push:
    branches: [main]
    # The PO agent commits docs/daily-plans/<date>.md straight to main every
    # morning. That push used to redeploy the service, replacing the
    # container and wiping the in-memory cycle tracker — so a cycle running
    # against theswarm itself killed itself the moment its own PO phase
    # wrote the plan (observed 2026-09-07: cycle e80598e4bc4a died 40s into
    # the TechLead phase). A daily plan changes no behaviour: nothing to
    # test, nothing to deploy.
    # Same trap, same fix: every cycle ends by appending a line to
    # docs/cycle-history.jsonl on the target's main. On the swarm's own
    # repository that commit redeployed the service at the very end of
    # the cycle that wrote it (336a73c, 2026-09-15).
    # Same trap again: the scheduled e2e harness (.github/workflows/harness.yml)
    # appends its result straight to docs/harness-runs.jsonl on main. A run
    # history line is not a behaviour change either — nothing to test, nothing
    # to deploy.
    paths-ignore:
      - 'docs/daily-plans/**'
      - 'docs/daily-reports/**'
      - 'docs/cycle-history.jsonl'
      - 'docs/harness-runs.jsonl'
      - 'AGENT_MEMORY.jsonl'
      # A demo film or a page of docs changes no behaviour either: the
      # docs-only merge of 2026-10-06 (#291) queued a deploy that would
      # have waited on the owner's running yakoi cycle and then interrupted
      # it a second time — which a cycle does not survive.
      - 'docs/**'
      - 'README.md'
  # Any base, not only main: the V2 runtime lands as stacked pull requests
  # (M0 ← M1 ← M2 …), each against the previous milestone's branch, and a
  # PR without CI is a PR nobody can merge. The deploy trigger above is
  # still `push` to main only. The default event types, spelled out so the
  # trigger stays a mapping (tests/test_deploy_trigger_guard.py reads it).
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  packages: write

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'

jobs:
  tests:
    runs-on: ubuntu-latest
    # The suite runs 9-12 min on a healthy shared runner and grows with every
    # feature. At 15 min there was no headroom left: a slow runner pushed PR
    # #93 to 43% at the cap, and GitHub reports a job that runs out of time
    # as "cancelled" — which reads as somebody hitting stop, not as a limit
    # being hit. 30 min still fails fast on a genuine hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Verify package imports
        run: |
          uv run python -c "import theswarm"
          uv run python -c "import theswarm_common"
      - name: Run tests with coverage
        run: uv run pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --ignore=tests/e2e -p no:playwright

  e2e-smoke:
    name: E2E smoke walk (required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Cache Playwright's Chromium download
        # The browser binary (~150MB, pinned by uv.lock's playwright version)
        # is fetched from Playwright's CDN on every runner; caching it here
        # lets the install step below skip the download on a cache hit.
        # System-level deps (--with-deps) still install from apt each run:
        # the runner's VM is thrown away after the job, so nothing on disk
        # outside this cached path survives between runs anyway.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
      - name: Run the route smoke walk and the axe pass
        run: |
          uv run pytest tests/e2e/test_smoke_walk.py \
            -v --tb=short --browser chromium

  deploy:
    # Delivery speed: every commit on main lands via a PR whose CI already
    # validated the same tree, so the deploy starts immediately instead of
    # waiting for an 8-minute re-run. Tests still execute in parallel above
    # as a safety net, and the deploy job itself health-checks the service
    # and rolls back automatically when it does not come up healthy.
    if: github.event_name == 'push'
    uses: ./.github/workflows/cd.yml
    with:
      action: deploy
    secrets: inherit
