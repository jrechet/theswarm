name: E2E harness

on:
  schedule:
    # Daily regression probe against the swarm's default demo target.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: 'owner/repo the harness drives (defaults to the regression probe target)'
        type: string
        default: 'jrechet/concert-tour-app'
      feature:
        description: 'Feature text handed to the composer (empty: the eval manifest''s feature of the day)'
        type: string
        default: ''
      all:
        description: 'Run every feature of the eval manifest, in order (the full series)'
        type: boolean
        default: false
      # jrechet/theswarm is deliberately NOT a default here: per AGENTS.md,
      # TheSwarm enforces one cycle per repo and self-cycle PRs are
      # approved-but-held for a person to merge, so an unattended scheduled
      # run against the swarm's own repo would either queue behind another
      # cycle or stall waiting on a manual merge. Running the harness against
      # theswarm is a manual override: type the repo in when dispatching.

env:
  PYTHON_VERSION: '3.12'

permissions:
  contents: read

concurrency:
  group: harness-${{ github.event.inputs.repo || 'jrechet/concert-tour-app' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Authenticated with BOT_GITHUB_TOKEN, not the default token: that's
      # the same identity already behind docs/cycle-history.jsonl commits
      # (it becomes GITHUB_TOKEN in the deployed app — see
      # .github/actions/write-env), so the publish step below can push
      # straight to main as that bot.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --dev
      - name: Run e2e harness
        env:
          SWARM_ACCESS_KEY: ${{ secrets.SWARM_ACCESS_KEY }}
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          # Inputs land in env, not interpolated straight into the shell
          # script below: templating github.event.inputs.* directly into a
          # `run:` block lets a crafted workflow_dispatch value break out of
          # the quoted argument and execute arbitrary shell with this job's
          # token (CWE-78). $REPO/$FEATURE are plain argv, never re-parsed.
          REPO: ${{ github.event.inputs.repo || 'jrechet/concert-tour-app' }}
          FEATURE: ${{ github.event.inputs.feature }}
          RUN_ALL: ${{ github.event.inputs.all }}
          # A failed run posts to the swarm's channel (theswarm.evals, M6);
          # without the token it is a line in this log. The host is the one
          # the Mattermost stack's Traefik router serves; a "404 page not
          # found" from it means no Mattermost container is running.
          MATTERMOST_URL: https://chat.jrec.fr
          MATTERMOST_BOT_TOKEN: ${{ secrets.MATTERMOST_BOT_TOKEN }}
          # print() to a pipe is block-buffered: without this, a library's
          # stderr line lands at the top of the log, far from its cause.
          PYTHONUNBUFFERED: '1'
        run: |
          # The scheduled run and a bare dispatch take the eval manifest's
          # feature of the day (evals/<target>.yaml — one a day, in
          # rotation, skipping the ones the target already has); a feature
          # typed in still runs as before; `all` runs the whole series.
          if [ "$RUN_ALL" = "true" ]; then
            uv run python scripts/cycle_e2e.py --repo "$REPO" --all
          elif [ -n "$FEATURE" ]; then
            uv run python scripts/cycle_e2e.py --repo "$REPO" --feature "$FEATURE"
          else
            uv run python scripts/cycle_e2e.py --repo "$REPO"
          fi

      # Same trap as docs/cycle-history.jsonl (see ci.yml paths-ignore): a
      # bare run-history commit must not look like a behaviour change, so it
      # is pushed straight to main with the same bot identity the Dev agent
      # already commits under, instead of a PR.
      - name: Publish run history
        if: always()
        env:
          REPO: ${{ github.event.inputs.repo || 'jrechet/concert-tour-app' }}
        run: |
          if [ -z "$(git status --porcelain -- docs/harness-runs.jsonl)" ]; then
            echo "no change to docs/harness-runs.jsonl"
            exit 0
          fi
          git config user.name "TheSwarm Dev Agent"
          git config user.email "swarm-dev@jrec.fr"
          git add docs/harness-runs.jsonl
          git commit -m "chore: harness run $(date -u +%Y-%m-%d) — $REPO"
          # The checkout is main as it was at *dispatch*: a run queued behind
          # another (the concurrency group above) starts without that run's
          # history line, and both appended at the end of the file. The
          # rebase keeps both lines because .gitattributes merges this file
          # with `union` (run 35908375032 died on that conflict); the loop
          # covers a push that lost a race with another commit to main. A
          # rebase that still stops is not a race: say so, never retry it
          # (and `bash -e` would end the step on it with no word anyway).
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::docs/harness-runs.jsonl does not rebase onto main — the run is recorded on the API, not in the file"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::docs/harness-runs.jsonl not published after 3 attempts"
          exit 1
