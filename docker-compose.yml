services:
  theswarm:
    image: ${TS_IMAGE:-theswarm}:${TS_TAG:-latest}
    ports:
      - "8091:8091"
    env_file:
      - .env
    environment:
      - BASE_PATH=/swarm
      # uv's cache on the persistent volume: what QA runs through
      # `uv tool run` (semgrep, pinned) is downloaded once, not per container.
      - UV_CACHE_DIR=/home/botuser/.swarm-data/uv-cache
      # Two Dev tasks side by side (V2 M5b), each in its own worktree and
      # venv: the plan's default after three green cycles at width 2
      # (section 8). 1 is the single path, the way back.
      - SWARM_DEV_PARALLELISM=2
      # V2 runtime: Claude calls go through the Agent SDK (its bundled
      # Claude Code binary, the subscription identity of the mounted
      # ~/.claude, a typed message stream). The `claude -p` CLI backend was
      # retired in M7; the way back is a revert, not this line.
      - SWARM_CLAUDE_BACKEND=sdk
      # Identity for the swarm's Dev agent git commits. Without these
      # `git commit` fails with 'Author identity unknown' (rc=128).
      - GIT_AUTHOR_NAME=TheSwarm Dev Agent
      - GIT_AUTHOR_EMAIL=swarm-dev@jrec.fr
      - GIT_COMMITTER_NAME=TheSwarm Dev Agent
      - GIT_COMMITTER_EMAIL=swarm-dev@jrec.fr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Claude Code (the SDK's bundled binary) needs write access to
      # ~/.claude for session/telemetry state on every call; :ro makes it
      # error out. This mount is prod's identity (V2 invariant I1).
      - /home/debian/.claude:/home/botuser/.claude
      - /home/debian/.claude.json:/home/botuser/.claude.json
      - /home/debian/swarm-data:/home/botuser/.swarm-data
      # The target clones outlive a deploy (V2 runtime M4): a cycle resumed
      # on the new container finds its tree, its uncommitted edits (I3
      # commits them first) and its .venv-swarm, instead of re-cloning and
      # redoing the interrupted iteration (747bb89eced2, 2026-09-23). A
      # named volume needs no host preparation.
      - swarm-workspaces:/home/botuser/.swarm-workspaces
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - default
      - mattermost_mattermost-internal
      - traefik-public
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.theswarm.rule=Host(`bots.jrec.fr`) && PathPrefix(`/swarm`)"
        - "traefik.http.routers.theswarm.entrypoints=websecure"
        - "traefik.http.routers.theswarm.tls=true"
        - "traefik.http.routers.theswarm.tls.certresolver=le"
        - "traefik.http.routers.theswarm.middlewares=theswarm-strip"
        - "traefik.http.middlewares.theswarm-strip.stripprefix.prefixes=/swarm"
        - "traefik.http.services.theswarm.loadbalancer.server.port=8091"

volumes:
  swarm-workspaces: {}

networks:
  default:
    name: theswarm_default
  mattermost_mattermost-internal:
    external: true
  traefik-public:
    external: true
