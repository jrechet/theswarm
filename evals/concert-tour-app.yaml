# The canonical features the swarm is measured on (V2 runtime, M6).
#
# One feature per day in rotation at 07:00 UTC (the subscription is a
# budget), skipping the features whose last run built them or found them
# built — the target keeps what the swarm merges; the whole series on a
# manual dispatch. Each run is scored — PR opened, CI on that PR, review
# decisions, cost, duration, files touched — and posted to the swarm's
# /api/evals/runs; the repo page shows the trend. When every feature here
# is delivered the harness warns: add new ones below.
# `built_by` records a feature the target already has that prod's history
# does not know — a local harness run, a filmed Play (which cycle, when):
# the rotation skips it. Remove the line after a target reset.
# `expected_paths` are globs the PR's files must match (empty: not
# judged); tighten them as the target's layout settles.
repo: jrechet/concert-tour-app
features:
  - id: remaining-tickets
    built_by: "before the eval series, PRs #203–#204"
    text: Show the remaining ticket count on each concert card
    expected_paths: ["**/*.py", "**/*.html", "**/*.js", "**/*.css"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: city-search
    text: |-
      Add a search box that filters the concert list by city
      Typing in the box narrows the list as the user types; clearing it shows every concert again.
    expected_paths: ["**/*.py", "**/*.html", "**/*.js", "**/*.css"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: chronological-order
    text: Sort the tour dates chronologically with the next concert first
    expected_paths: ["**/*.py", "**/*.html", "**/*.js"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: sold-out-badge
    text: Show a "sold out" badge on a concert card when no tickets remain
    expected_paths: ["**/*.py", "**/*.html", "**/*.css", "**/*.js"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: upcoming-json
    text: |-
      Add a JSON endpoint listing the upcoming concerts
      GET /api/concerts/upcoming returns the concerts whose date is today or later, soonest first, as JSON.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  # Added 2026-09-25: the first five were all built (the rotation then runs
  # a delivered feature and measures nothing new — the harness warns when
  # every feature here is delivered). Each is small, independent of the
  # others, and checkable from its PR.
  - id: venue-filter
    text: |-
      Filter the concert list by venue
      GET /api/v1/concerts accepts ?venue=<name> and returns only that venue's concerts; the match ignores case.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: pagination
    text: |-
      Paginate the concert list
      GET /api/v1/concerts accepts ?page= and ?page_size= (default 20, at most 100) and returns the total count in an X-Total-Count header.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: csv-export
    text: |-
      Export the concerts as CSV
      GET /api/v1/concerts/export.csv returns every concert as CSV with a header row: date, city, venue, tour.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: tour-summary
    text: |-
      Summarise a tour
      GET /api/v1/tours/{id}/summary returns the number of dates, the first and the last date, and the number of distinct cities of that tour; 404 for an unknown tour.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: past-concerts-toggle
    built_by: "local harness, cycle f211f5c2ccf1, 2026-09-29, PRs #439–#441"
    text: |-
      Hide past concerts by default
      The concert list shows only today's and future concerts; a "Show past concerts" toggle brings the past ones back.
    expected_paths: ["**/*.py", "**/*.html", "**/*.js", "**/*.css"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: ical-feed
    built_by: "local harness, cycle 79e1658b2462, 2026-09-29, PRs #430–#432"
    text: |-
      Subscribe to a tour in a calendar
      GET /api/v1/tours/{id}/calendar.ics returns the tour's dates as an iCalendar feed, one event per concert with its city and venue.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: price-range
    built_by: "local harness, cycle 6186726707ca, 2026-09-28, PRs #415–#417"
    text: |-
      Filter the concerts by ticket price
      GET /api/v1/concerts accepts min_price and max_price (inclusive); a concert without a price is excluded when either is given, and min_price above max_price is a 422.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: occupancy
    built_by: "a filmed Play, cycle 28371c2016da, 2026-09-28, PRs #392–#395"
    text: |-
      Show how full a concert is
      GET /api/v1/concerts/{id}/occupancy returns tickets sold, the venue's capacity and the percentage sold (null when the capacity is unknown); 404 for an unknown concert.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: country-stats
    built_by: "local harness, cycle 7f4f2188cd90, 2026-09-28, PRs #408–#410"
    text: |-
      Count the concerts per country
      GET /api/v1/stats/countries returns each country with its number of concerts, most concerts first; cancelled concerts are not counted.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: tour-revenue
    built_by: "local harness, cycle 03790f693195, 2026-09-28, PRs #422–#424"
    text: |-
      Report a tour's ticket revenue
      GET /api/v1/tours/{id}/revenue returns the sum of ticket price times tickets sold over the tour's concerts, cancelled ones excluded, and the number of concerts it counted; 404 for an unknown tour.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: next-concert
    built_by: "a filmed Play, cycle 57adc6cdea13, 2026-09-28, PRs #401–#403"
    text: |-
      Tell a fan when the next concert is
      GET /api/v1/concerts/next returns the soonest concert from now on that is not cancelled, with its venue and city; 404 when there is none.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: tour-status-filter
    text: |-
      List the tours by status
      GET /api/v1/tours accepts status (planned, active, completed) and returns only the tours with that status; an unknown status is a 422.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  # Topped up on 2026-09-29: every feature above had been run (the harness
  # warns when the manifest is exhausted). None of these routes existed.
  - id: sell-tickets
    built_by: "local harness, cycle 68fd55bf81e5, 2026-09-29, PRs #447–#450"
    text: |-
      Sell tickets for a concert
      POST /api/v1/concerts/{id}/tickets with a positive quantity adds it to the tickets sold and returns the concert with its remaining tickets; 409 when it would exceed the venue's capacity or the concert is cancelled, 422 for a quantity under 1, 404 for an unknown concert.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: lineup-add
    built_by: "local harness, cycle 383c7f77d983, 2026-09-29, PRs #455–#456"
    text: |-
      Add a support act to a concert's lineup
      POST /api/v1/concerts/{id}/lineup with an artist name and a set order adds the act and returns 201 with it; 409 when that set order is already taken for the concert, 404 for an unknown concert.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: cancel-tour
    built_by: "local harness, cycle d119d706fbae, 2026-09-29, PRs #462–#464"
    text: |-
      Cancel a whole tour
      POST /api/v1/tours/{id}/cancel with a reason cancels every upcoming concert of the tour not already cancelled, with that reason, and returns how many it cancelled; 404 for an unknown tour, 422 without a reason.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: sold-out-list
    built_by: "local harness, cycle d80e66ee0e62, 2026-09-29, PRs #469–#470"
    text: |-
      List the sold-out concerts
      GET /api/v1/concerts/sold-out returns the upcoming concerts with no ticket left, soonest first; cancelled concerts are not listed.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: month-stats
    built_by: "local harness, cycle ed1aa4d9a9fd, 2026-09-29, PRs #475–#477"
    text: |-
      Count the concerts per month
      GET /api/v1/stats/months returns, for each month that has concerts (YYYY-MM), the number of concerts that are not cancelled, in chronological order.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: price-stats
    built_by: "local harness, cycle 79f45fdaadb9, then its resume 4eaa5b767051, 2026-09-29, PRs #485–#486"
    text: |-
      Summarise ticket prices
      GET /api/v1/stats/prices returns the lowest, the average and the highest ticket price over the upcoming concerts that are not cancelled and have a price; all three null when there is none.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: tour-cities
    built_by: "local harness, cycle 2dd724ff92cf, 2026-09-29, PRs #491–#493"
    text: |-
      Show the cities a tour goes through
      GET /api/v1/tours/{id}/cities returns the distinct cities of the tour's concerts in date order, cancelled concerts left out; 404 for an unknown tour.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  # Topped up again the same evening: all twenty-four were built by then
  # (the last seven in one day, locally). None of these routes existed;
  # artist-search puts /tours/search beside /tours/{tour_id} on purpose.
  - id: refund-tickets
    built_by: "local harness, cycle 8e614eabfb1e, 2026-09-29, PRs #498–#499"
    text: |-
      Refund tickets for a concert
      POST /api/v1/concerts/{id}/refunds with a quantity gives back that many tickets and returns the concert with its updated counts; 422 for a quantity of zero or less, 409 when refunding more tickets than were sold, 404 for an unknown concert.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: lineup-remove
    built_by: "local harness, cycle de5e914a8d5c, 2026-09-30, PRs #513–#514"
    text: |-
      Take an act off a concert's lineup
      DELETE /api/v1/concerts/{id}/lineup/{entry_id} removes that lineup entry and answers 204; 404 when the concert or the entry does not exist, or the entry belongs to another concert.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: reschedule-concert
    built_by: "local harness, cycle 7af87e116df7, 2026-09-30, PRs #519–#520"
    text: |-
      Reschedule a concert
      PATCH /api/v1/concerts/{id} with a new date_time moves the concert and returns it; 422 for a date in the past, 409 for a cancelled concert, 404 for an unknown concert.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: tour-span
    built_by: "local harness, cycle 7b0bf367054b, 2026-09-30, PRs #525–#527"
    text: |-
      Show when a tour starts and ends
      GET /api/v1/tours/{id}/span returns the first and last concert dates of the tour and the number of days between them, cancelled concerts left out; all null when it has none; 404 for an unknown tour.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: tour-occupancy
    built_by: "local harness, cycle 3e2c11a40ee6, 2026-09-30, PRs #531–#532"
    text: |-
      Show how full a whole tour is
      GET /api/v1/tours/{id}/occupancy returns the tickets sold, the total capacity and the percentage sold over the tour's concerts that are not cancelled; 404 for an unknown tour.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: weekday-stats
    built_by: "local harness, cycle ac1fa9d785d6, 2026-09-30, PRs #537–#539"
    text: |-
      Count the concerts per weekday
      GET /api/v1/stats/weekdays returns, for each day of the week from Monday to Sunday, how many concerts that are not cancelled fall on it — every day present, zero included.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: artist-search
    built_by: "local harness, cycle da79522769b3, 2026-09-29, PRs #504–#506"
    text: |-
      Search the tours by artist
      GET /api/v1/tours/search?artist=<text> returns the tours whose artist contains the text, case-insensitive; 422 without the parameter; the existing GET /api/v1/tours/{id} keeps working.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: venues-list
    text: |-
      List the venues
      GET /api/v1/venues returns every venue with its name, city, country and capacity, sorted by name; ?min_capacity=N keeps the venues that hold at least N people; 422 for a negative min_capacity.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: concert-date-range
    text: |-
      Find the concerts between two dates
      GET /api/v1/concerts/between?start=YYYY-MM-DD&end=YYYY-MM-DD returns the concerts whose date falls in that range, both days included, soonest first; 422 when start is after end, or a date is missing or malformed.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: lineup-reorder
    text: |-
      Move an act in a concert's lineup
      PATCH /api/v1/concerts/{id}/lineup/{entry_id} with a new set_order moves that lineup entry and returns it; 422 for a set_order of zero or less; 404 when the concert or the entry does not exist, or the entry belongs to another concert.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: concert-notes
    built_by: "local harness, cycle ec299e36a508, 2026-09-30, PRs #544–#546"
    text: |-
      Keep notes on a concert
      PUT /api/v1/concerts/{id}/notes with {"notes": "..."} stores up to 500 characters of notes and returns the concert with them; GET /api/v1/concerts/{id} shows them too, null until set; 422 above 500 characters; 404 for an unknown concert.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: revenue-by-city
    text: |-
      Show the ticket revenue per city
      GET /api/v1/stats/revenue/cities returns, for each city, the revenue of its concerts that are not cancelled (tickets sold times the ticket price), highest first; concerts without a price count for 0.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: tour-duplicate
    text: |-
      Duplicate a tour
      POST /api/v1/tours/{id}/duplicate creates a new tour for the same artist, named "<name> (copy)", with the status planned and no concerts, and answers 201 with it; 404 for an unknown tour.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: artists-list
    built_by: "local harness, cycle 2e713964f7a3, 2026-10-06, PRs #579–#581"
    text: |-
      List the artists on tour
      GET /api/v1/artists returns each distinct artist across the tours, alphabetical, with the number of tours they have; an empty list when there is none.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: venue-detail
    text: |-
      Show a venue and what plays there
      GET /api/v1/venues/{id} returns the venue with its name, city, country and capacity, and its upcoming concerts that are not cancelled, soonest first; 404 for an unknown venue.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: venue-create
    text: |-
      Add a venue
      POST /api/v1/venues with a name, a city, a country and a capacity creates the venue and answers 201 with it; 422 for a capacity of zero or less or a missing name; 409 when that city already has a venue of that name.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: concert-price
    text: |-
      Change a concert's ticket price
      PATCH /api/v1/concerts/{id}/price with {"ticket_price": "..."} sets the price and returns the concert; 422 for a negative price; 409 for a cancelled concert; 404 for an unknown concert.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: lineup-clear
    text: |-
      Clear a concert's lineup
      DELETE /api/v1/concerts/{id}/lineup removes every act from the concert's lineup and answers 204, the concert itself kept; 404 for an unknown concert.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: sold-out-tours
    text: |-
      List the sold-out tours
      GET /api/v1/tours/sold-out returns the tours whose every concert that is not cancelled is sold out, a tour without such concerts left out; an empty list when there is none; GET /api/v1/tours/{id} keeps working.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: tour-uncancel
    text: |-
      Bring a cancelled tour back
      POST /api/v1/tours/{id}/uncancel restores a cancelled tour to planned, and its concerts that were cancelled with it, and returns the tour; 409 when the tour is not cancelled; 404 for an unknown tour.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
  - id: stats-capacity
    text: |-
      Count the seats left
      GET /api/v1/stats/capacity returns the total capacity, the tickets sold and the seats left over the upcoming concerts that are not cancelled; zeros when there is none.
    expected_paths: ["**/*.py"]
    max_cost_usd: 8
    max_duration_s: 3600
