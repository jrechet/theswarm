{% extends "bare.html" %}
{% block title %}TheSwarm — Not yours{% endblock %}
{% block body %}
<div class="w-full max-w-[400px] flex flex-col gap-3 p-7 bg-surface border border-line rounded-xl text-center" data-testid="refused">
  <h1 class="m-0 text-[20px] font-semibold tracking-tight">This page belongs to someone else</h1>
  <p class="m-0 text-[13px] text-muted">{% if name %}{{ name }}, you{% else %}You{% endif %} see your own projects, their progress and their demos — nothing else.</p>
  <a href="{{ home }}" class="h-9 inline-flex items-center justify-center rounded-md bg-ink text-on-ink text-[13px] font-medium mt-2">Back to your projects</a>
</div>
{% endblock %}
