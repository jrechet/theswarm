mattermost:
  base_url: "https://chat.jrec.fr"
  channel_name: "swarm-bots-logs"

server:
  host: "0.0.0.0"
  port: 8091
  external_url: "https://bots.jrec.fr"

agents:
  swarm_po:
    enabled: true
    llm_backend: "claude-code"
    github_repos:
      - "jrechet/swarm-todo-app"
      - "jrechet/concert-tour-app"
    default_repo: "jrechet/concert-tour-app"
    team_channel: "swarm-team"
    channel: "swarm-bots-logs"

# How the swarm demos itself. QA starts a target with `demo.command` when it
# declares one, instead of the FastAPI default (uvicorn src.main:app).
# Placeholders: {python} — the target's interpreter, {port}, {tmp} — a fresh
# directory. The environment is scrubbed: only demo.env reaches the process,
# so this second instance never holds the real GitHub or Mattermost tokens.
# ready_seconds overrides QA's default 30s readiness wait — `theswarm serve`
# takes ~30s to boot in the container, so the default window is too tight.
# pages replaces the guessed screenshot/video walk (/, /docs, /health) with
# pages that actually exist on this app — /docs 404s here (#144).
# setup runs once in the workspace before the first launch: the QA workspace
# is a plain clone, and static/v3/app.css is generated, not checked in.
demo:
  command: "{python} -m theswarm serve --host 127.0.0.1 --port {port} --db {tmp}/demo.db"
  ready_seconds: 90
  pages:
    - "/"
    - "/r/jrechet/theswarm"
  setup:
    - "bash scripts/build-css.sh"
  env:
    SWARM_AUTH_DISABLED: "1"
    BASE_PATH: ""

# The owner's stack, declared for the DevOps persona (D1) — never guessed.
# Credentials stay in the environment and the vault: this names where things
# live. `hosts[].ssh` is read with the ambient keys (the laptop's today; prod
# reads the host only once a key is mounted — the owner's decision).
stack:
  hosts:
    - name: jrec.fr
      ssh: debian@jrec.fr
      port: 5422
      roles: [docker-swarm, traefik, seq, github-runners]
      ci_slot_dir: /srv/gh-runner-work/ci-slots
      ci_slot_stale_minutes: 180
      disk_paths: ["/", "/srv"]
  ci:
    - provider: github-actions
      repo: jrechet/theswarm
      runners: [self-hosted, jre-server]
      deploy_workflow: ci.yml  # the deploy is a job of the CI run on main (cd.yml is workflow_called)
    - provider: forgejo
      url: https://forge.jrec.fr/jrechet/theswarm
      role: mirror
  registry: ghcr.io/jrechet/theswarm
  deploy:
    method: docker-swarm
    service: theswarm_theswarm
    url: https://bots.jrec.fr/swarm
  logs:
    seq: https://logs.jrec.fr
  harness:
    repo: jrechet/concert-tour-app
